<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Restaurant Recommendations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .mood-display {
            background-color: #e9f5fe;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .mood-display h2 {
            color: #4a90e2;
            margin-bottom: 5px;
        }
        .no-results {
            padding: 40px;
            text-align: center;
            background-color: #f8f9fa;
            border-radius: 10px;
            margin-top: 20px;
        }
        .back-btn {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="text-center my-5">
            <h1>Your Restaurant Recommendations</h1>
            <p class="lead">Based on your mood and preferences</p>
        </header>

        <div class="row justify-content-center">
            <div class="col-md-10">
                <button class="btn btn-outline-primary back-btn" onclick="window.location.href='index.html'">
                    <i class="fas fa-arrow-left"></i> Back to Search
                </button>
                
                <div class="mood-display">
                    <h2>Your Mood: <span id="selectedMood">Loading...</span></h2>
                    <p id="additionalCriteria">Loading preferences...</p>
                </div>

                <div id="results" class="row">
                    <!-- Results will be dynamically inserted here -->
                </div>

                <div id="noResults" class="no-results d-none">
                    <h3>No restaurants found</h3>
                    <p>Try different mood or preferences</p>
                    <button class="btn btn-primary mt-3" onclick="window.location.href='index.html'">Try Again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get parameters from URL
            const urlParams = new URLSearchParams(window.location.search);
            const mood = urlParams.get('mood');
            const location = urlParams.get('location');
            const priceRange = urlParams.get('price_range');
            
            // Display selected criteria
            document.getElementById('selectedMood').textContent = mood ? 
                mood.charAt(0).toUpperCase() + mood.slice(1) : 'Not specified';
            
            let additionalText = [];
            if (location) additionalText.push(`Location: ${location}`);
            if (priceRange) {
                const priceRangeText = {
                    'low': 'Budget Friendly (≤₹500)',
                    'medium': 'Mid-Range (₹500-₹1500)',
                    'high': 'Premium (>₹1500)'
                }[priceRange] || priceRange;
                additionalText.push(`Price Range: ${priceRangeText}`);
            }
            
            document.getElementById('additionalCriteria').textContent = 
                additionalText.length > 0 ? additionalText.join(' | ') : 'No additional preferences specified';

            // Get restaurant results from localStorage
            const restaurantResults = JSON.parse(localStorage.getItem('restaurantResults') || '[]');
            const resultsDiv = document.getElementById('results');
            
            if (restaurantResults.length === 0) {
                document.getElementById('noResults').classList.remove('d-none');
            } else {
                restaurantResults.forEach(restaurant => {
                    resultsDiv.appendChild(createRestaurantCard(restaurant));
                });
            }
        });

        function createRestaurantCard(restaurant) {
            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4';
            
            const card = document.createElement('div');
            card.className = 'restaurant-card';
            
            const ratingStars = '★'.repeat(Math.round(restaurant.dinner_rating)) + 
                               '☆'.repeat(5 - Math.round(restaurant.dinner_rating));

            card.innerHTML = `
                <div class="card-body">
                    <h5 class="card-title">${restaurant.name}</h5>
                    <p class="card-text">
                        <span class="rating">${ratingStars}</span>
                        <small class="text-muted">(${restaurant.dinner_rating.toFixed(1)})</small>
                    </p>
                    <p class="card-text">${restaurant.cuisines}</p>
                    <p class="card-text"><small class="text-muted">${restaurant.area}</small></p>
                    <p class="card-text">₹${restaurant.average_cost} for two</p>
                    
                    <ul class="features-list">
                        ${restaurant.home_delivery ? '<li><i class="fas fa-motorcycle"></i> Delivery</li>' : ''}
                        ${restaurant.takeaway ? '<li><i class="fas fa-shopping-bag"></i> Takeaway</li>' : ''}
                        ${restaurant.indoor_seating ? '<li><i class="fas fa-chair"></i> Dine-in</li>' : ''}
                    </ul>
                    
                    ${restaurant.popular_dishes ? 
                        `<p class="card-text"><small class="text-muted">Popular: ${restaurant.popular_dishes}</small></p>` : ''}
                    
                    <p class="card-text mt-2">
                        <small class="text-muted">
                            ${restaurant.known_for ? `Known for: ${restaurant.known_for}` : ''}
                        </small>
                    </p>

                    <div class="mt-3">
                        <button class="btn btn-sm btn-outline-primary">View Details</button>
                    </div>
                </div>
            `;
            
            col.appendChild(card);
            return col;
        }
    </script>
</body>
</html>
